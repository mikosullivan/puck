<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
	<defs>
		<filter id="tooltip-shadow" x="-10%" y="-10%" width="120%" height="120%">
			<feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.45"/>
		</filter>
		<style>
			.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
		</style>
	</defs>

	<!-- ===== Window background ===== -->
	<rect width="880" height="420" rx="10" fill="#1e1e1e"/>

	<!-- ===== Title bar ===== -->
	<rect x="0" y="0" width="880" height="30" fill="#3c3c3c"/>
	<rect x="0" y="20" width="880" height="10" fill="#3c3c3c"/>
	<circle cx="18" cy="15" r="6" fill="#ff5f57"/>
	<circle cx="38" cy="15" r="6" fill="#febc2e"/>
	<circle cx="58" cy="15" r="6" fill="#28c840"/>
	<text x="440" y="19" text-anchor="middle" fill="#cccccc" font-size="13">example.casp — myproject — Visual Studio Code</text>

	<!-- ===== Activity bar ===== -->
	<rect x="0" y="30" width="44" height="368" fill="#333333"/>
	<rect x="0" y="46" width="2" height="28" fill="#ffffff"/>
	<rect x="13" y="50" width="20" height="18" fill="none" stroke="#ffffff" stroke-width="1.4" rx="1"/>
	<line x1="17" y1="56" x2="29" y2="56" stroke="#ffffff" stroke-width="1.4"/>
	<line x1="17" y1="60" x2="29" y2="60" stroke="#ffffff" stroke-width="1.4"/>
	<line x1="17" y1="64" x2="26" y2="64" stroke="#ffffff" stroke-width="1.4"/>
	<circle cx="22" cy="96" r="7" fill="none" stroke="#858585" stroke-width="1.4"/>
	<line x1="27" y1="101" x2="32" y2="106" stroke="#858585" stroke-width="1.6"/>
	<circle cx="18" cy="142" r="3" fill="none" stroke="#858585" stroke-width="1.4"/>
	<circle cx="30" cy="156" r="3" fill="none" stroke="#858585" stroke-width="1.4"/>
	<circle cx="18" cy="170" r="3" fill="none" stroke="#858585" stroke-width="1.4"/>
	<line x1="18" y1="145" x2="18" y2="167" stroke="#858585" stroke-width="1.4"/>
	<path d="M20,151 Q30,151 30,153" fill="none" stroke="#858585" stroke-width="1.4"/>
	<polygon points="15,196 15,216 31,206" fill="none" stroke="#858585" stroke-width="1.4"/>
	<rect x="14" y="246" width="8" height="8" fill="none" stroke="#858585" stroke-width="1.4"/>
	<rect x="26" y="246" width="8" height="8" fill="none" stroke="#858585" stroke-width="1.4"/>
	<rect x="14" y="258" width="8" height="8" fill="none" stroke="#858585" stroke-width="1.4"/>
	<rect x="28" y="260" width="6" height="6" fill="#858585"/>

	<!-- ===== Sidebar (file explorer) ===== -->
	<rect x="44" y="30" width="180" height="368" fill="#252526"/>
	<text x="58" y="52" fill="#bbbbbb" font-size="12" font-weight="700" letter-spacing="0.6">EXPLORER</text>
	<text x="208" y="52" text-anchor="end" fill="#858585" font-size="14">…</text>
	<text x="58" y="80" fill="#cccccc" font-size="13">▾ MYPROJECT</text>
	<text x="74" y="104" fill="#cccccc" font-size="13">▾ src</text>
	<!-- Selected file row -->
	<rect x="44" y="112" width="180" height="24" fill="#37373d"/>
	<rect x="44" y="112" width="2" height="24" fill="#0078d4"/>
	<text x="92" y="129" fill="#ffffff" font-size="13">example.casp</text>
	<text x="92" y="153" fill="#cccccc" font-size="13">helper.casp</text>
	<text x="92" y="177" fill="#cccccc" font-size="13">main.casp</text>
	<text x="74" y="201" fill="#cccccc" font-size="13">▸ tests</text>
	<text x="74" y="225" fill="#cccccc" font-size="13">  README.md</text>

	<!-- ===== Editor tab bar ===== -->
	<rect x="224" y="30" width="656" height="34" fill="#2d2d2d"/>
	<rect x="224" y="30" width="180" height="34" fill="#1e1e1e"/>
	<rect x="224" y="30" width="180" height="2" fill="#0078d4"/>
	<text x="246" y="51" fill="#ffffff" font-size="13">example.casp</text>
	<text x="384" y="53" fill="#aaaaaa" font-size="16">×</text>
	<!-- Breadcrumbs -->
	<rect x="224" y="64" width="656" height="22" fill="#1e1e1e"/>
	<text x="240" y="79" fill="#888888" font-size="12">src ▸ example.casp</text>

	<!-- ===== Editor content ===== -->
	<rect x="224" y="86" width="656" height="312" fill="#1e1e1e"/>

	<!-- Line number gutter & code (font-size 17, line-height 28) -->
	<g class="mono" font-size="17">
		<text x="240" y="120" fill="#858585">1</text>
		<text x="240" y="148" fill="#858585">2</text>
		<text x="240" y="176" fill="#858585">3</text>
		<text x="240" y="204" fill="#858585">4</text>
		<text x="240" y="232" fill="#858585">5</text>
		<text x="240" y="260" fill="#858585">6</text>
		<text x="240" y="288" fill="#858585">7</text>

		<!-- Line 1: $current = %role -->
		<text x="270" y="120">
			<tspan fill="#9cdcfe">$current</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#c586c0">%role</tspan>
		</text>

		<!-- Line 3: if $current == 'admin' -->
		<text x="270" y="176">
			<tspan fill="#c586c0">if</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">$current</tspan><tspan fill="#d4d4d4"> == </tspan><tspan fill="#ce9178">'admin'</tspan>
		</text>

		<!-- Line 4: indented call -->
		<text x="310" y="204">
			<tspan fill="#9cdcfe">$manager</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">drop_safeguards</tspan><tspan fill="#d4d4d4">()</tspan>
		</text>

		<!-- Line 5: else -->
		<text x="270" y="232">
			<tspan fill="#c586c0">else</tspan>
		</text>

		<!-- Line 6: indented call -->
		<text x="310" y="260">
			<tspan fill="#9cdcfe">$manager</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">apply_safeguards</tspan><tspan fill="#d4d4d4">()</tspan>
		</text>

		<!-- Line 7: end -->
		<text x="270" y="288">
			<tspan fill="#c586c0">end</tspan>
		</text>
	</g>

	<!-- Cursor / hover-target highlight on the %role token in line 1 -->
	<rect x="378" y="105" width="60" height="22" fill="none" stroke="#6a9955" stroke-width="1" stroke-dasharray="3 2" rx="2"/>

	<!-- ===== Hover tooltip ===== -->
	<g transform="translate(395, 138)" filter="url(#tooltip-shadow)">
		<rect width="440" height="180" fill="#252526" stroke="#454545" stroke-width="1" rx="4"/>

		<!-- Header -->
		<text x="14" y="28" class="mono" font-size="15">
			<tspan fill="#c586c0">%role</tspan><tspan fill="#888888"> — system surface</tspan>
		</text>
		<line x1="14" y1="40" x2="426" y2="40" stroke="#3c3c3c" stroke-width="1"/>

		<!-- Description -->
		<text x="14" y="64" fill="#d4d4d4" font-size="14">Returns the role the current code is</text>
		<text x="14" y="84" fill="#d4d4d4" font-size="14">running under. Also serves as a namespace</text>
		<text x="14" y="104" fill="#d4d4d4" font-size="14">for ops like %role.delegate_to.</text>

		<!-- Signature -->
		<text x="14" y="134" class="mono" font-size="13" fill="#888888">→ puck.uno/role</text>

		<!-- Footer / doc link -->
		<line x1="14" y1="148" x2="426" y2="148" stroke="#3c3c3c" stroke-width="1"/>
		<text x="14" y="170" font-size="13">
			<tspan fill="#3794ff">📖 puck.uno/.../caspian/roles</tspan>
		</text>
	</g>

	<!-- ===== Status bar ===== -->
	<rect x="0" y="398" width="880" height="22" fill="#007acc"/>
	<text x="12" y="413" fill="#ffffff" font-size="12">⎇ master</text>
	<text x="92" y="413" fill="#ffffff" font-size="12">✓ 0   ⚠ 0</text>
	<text x="164" y="413" fill="#ffffff" font-size="12">caspian lsp ready</text>
	<text x="666" y="413" fill="#ffffff" font-size="12">Ln 1, Col 17</text>
	<text x="758" y="413" fill="#ffffff" font-size="12">UTF-8</text>
	<text x="808" y="413" fill="#ffffff" font-size="12">Caspian</text>
</svg>
