<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="1500"
	role="img"
	aria-label="CVM schema entity-relationship diagram. Five tables in three color-coded clusters: `cvm` marker (gray), `objects` and `refs` object graph (teal), `instance_listeners` and `class_listeners` (purple). Plus five derived views (blue-gray). Frames, roles, and processes are not separate tables — they are `objects` rows discriminated by the `primitive` column ('f' = frame, 'r' = role, 'o' / 'h' / 'a' for scalars and containers; `process = 1` marks a cap frame). Foreign keys drawn as curved gray arrows; self-referential FKs (parent_role, owner_role, parent_frame) as small circular self-loops on the source column.">

	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
			markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
		</marker>
		<style>
			.table-name { font: 700 13px 'Helvetica Neue', Arial, sans-serif; fill: #ffffff }
			.pk         { font: 700 11px 'Helvetica Neue', Arial, sans-serif; fill: #212121 }
			.col        { font:     11px 'Helvetica Neue', Arial, sans-serif; fill: #616161 }
			.fk         { font: 600 11px 'Helvetica Neue', Arial, sans-serif; fill: #005580 }
			.note       { font: italic 11px 'Helvetica Neue', Arial, sans-serif; fill: #757575 }
			.fk-arrow   { stroke: #333; stroke-width: 1.4; fill: none }
			.self-fk    { stroke: #000; stroke-width: 1.4; fill: none }
			.cluster-label { font: italic 12px 'Helvetica Neue', Arial, sans-serif; fill: #757575 }
			.title      { font: 700 20px 'Helvetica Neue', Arial, sans-serif; fill: #212121 }
		</style>
	</defs>

	<rect width="100%" height="100%" fill="#ffffff"/>
	<text x="750" y="34" text-anchor="middle" class="title">CVM schema</text>

	<!-- =========================================================== -->
	<!-- Cluster labels                                              -->
	<!-- =========================================================== -->
	<text x="170" y="58" text-anchor="middle" class="cluster-label" fill="#616161">marker</text>
	<text x="420" y="58" text-anchor="middle" class="cluster-label" fill="#26a69a">object graph</text>
	<text x="890" y="58" text-anchor="middle" class="cluster-label" fill="#9575cd">listeners</text>

	<!-- =========================================================== -->
	<!-- cvm — marker table (gray)                                   -->
	<!-- =========================================================== -->
	<g transform="translate(70, 70)">
		<rect x="0" y="0" width="200" height="80" rx="6" ry="6"
			fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 188 q 6,0 6,6 V 26 H 0 Z" fill="#9e9e9e"/>
		<text x="100" y="18" text-anchor="middle" class="table-name">cvm</text>
		<text x="10" y="44" class="pk">PK: key</text>
		<text x="10" y="62" class="col">col: value</text>
	</g>

	<!-- =========================================================== -->
	<!-- objects — object graph (teal), the big one                  -->
	<!-- =========================================================== -->
	<g transform="translate(320, 70)">
		<rect x="0" y="0" width="200" height="426" rx="6" ry="6"
			fill="#ffffff" stroke="#26a69a" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 188 q 6,0 6,6 V 26 H 0 Z" fill="#26a69a"/>
		<text x="100" y="18" text-anchor="middle" class="table-name">objects</text>

		<text x="10" y="44"  class="pk">PK: object_pk</text>
		<text x="10" y="66"  class="col">col: primitive</text>
		<text x="10" y="88"  class="col">col: scalar_type</text>
		<text x="10" y="110" class="col">col: scalar_value</text>
		<text x="10" y="132" class="col">col: engine_class</text>
		<text x="10" y="154" class="col">col: core_role</text>
		<text x="10" y="176" class="fk">FK: parent_role</text>
		<text x="10" y="198" class="fk">FK: owner_role</text>
		<text x="10" y="220" class="col">col: ast</text>
		<text x="10" y="242" class="col">col: stmt_idx</text>
		<text x="10" y="264" class="col">col: process</text>
		<text x="10" y="286" class="fk">FK: parent_frame</text>
		<text x="10" y="308" class="col">col: persistent</text>
		<text x="10" y="330" class="col">col: gc</text>
		<text x="10" y="352" class="col">col: needs_trace</text>
		<text x="10" y="374" class="col">col: in_trace</text>
		<text x="10" y="396" class="col">col: debug</text>

		<!-- Self-loop for parent_role (y=176) -->
		<path class="self-fk"
			d="M 200,176 c 12,-8 12,-14 4,-16 c -8,-2 -12,10 -4,16"
			marker-end="url(#arrow)"/>
		<!-- Self-loop for owner_role (y=198) -->
		<path class="self-fk"
			d="M 200,198 c 12,-8 12,-14 4,-16 c -8,-2 -12,10 -4,16"
			marker-end="url(#arrow)"/>
		<!-- Self-loop for parent_frame (y=286) -->
		<path class="self-fk"
			d="M 200,286 c 12,-8 12,-14 4,-16 c -8,-2 -12,10 -4,16"
			marker-end="url(#arrow)"/>
	</g>

	<!-- Cluster note under objects -->
	<text x="420" y="516" text-anchor="middle" class="note">frames, roles, processes → `objects` rows via the `primitive` discriminator</text>

	<!-- =========================================================== -->
	<!-- refs — object graph (teal)                                  -->
	<!-- =========================================================== -->
	<g transform="translate(580, 70)">
		<rect x="0" y="0" width="220" height="162" rx="6" ry="6"
			fill="#ffffff" stroke="#26a69a" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 208 q 6,0 6,6 V 26 H 0 Z" fill="#26a69a"/>
		<text x="110" y="18" text-anchor="middle" class="table-name">refs</text>

		<text x="10" y="44"  class="pk">PK: ref_pk</text>
		<text x="10" y="66"  class="fk">FK: parent  →  objects</text>
		<text x="10" y="88"  class="fk">FK: child   →  objects</text>
		<text x="10" y="110" class="col">col: key</text>
		<text x="10" y="132" class="col">col: idx</text>
		<text x="10" y="154" class="col">col: debug</text>
	</g>

	<!-- =========================================================== -->
	<!-- instance_listeners (purple)                                 -->
	<!-- =========================================================== -->
	<g transform="translate(830, 70)">
		<rect x="0" y="0" width="260" height="162" rx="6" ry="6"
			fill="#ffffff" stroke="#9575cd" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 248 q 6,0 6,6 V 26 H 0 Z" fill="#9575cd"/>
		<text x="130" y="18" text-anchor="middle" class="table-name">instance_listeners</text>

		<text x="10" y="44"  class="pk">PK: reg_pk</text>
		<text x="10" y="66"  class="fk">FK: broadcaster  →  objects</text>
		<text x="10" y="88"  class="fk">FK: listener     →  objects</text>
		<text x="10" y="110" class="col">col: event_name</text>
		<text x="10" y="132" class="col">col: method_name</text>
	</g>

	<!-- =========================================================== -->
	<!-- class_listeners (purple)                                    -->
	<!-- =========================================================== -->
	<g transform="translate(830, 270)">
		<rect x="0" y="0" width="260" height="162" rx="6" ry="6"
			fill="#ffffff" stroke="#9575cd" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 248 q 6,0 6,6 V 26 H 0 Z" fill="#9575cd"/>
		<text x="130" y="18" text-anchor="middle" class="table-name">class_listeners</text>

		<text x="10" y="44"  class="pk">PK: reg_pk</text>
		<text x="10" y="66"  class="fk">FK: class     →  objects</text>
		<text x="10" y="88"  class="fk">FK: listener  →  objects</text>
		<text x="10" y="110" class="col">col: event_name</text>
		<text x="10" y="132" class="col">col: method_name</text>
	</g>

	<!-- =========================================================== -->
	<!-- FK arrows: cross-table                                      -->
	<!-- All FKs into objects converge on `object_pk` (y=44 inside   -->
	<!-- the objects box translated by (320,70) — absolute (330,114)) -->
	<!-- =========================================================== -->

	<!-- refs.parent → objects (from left edge of refs at y=66 abs 136) -->
	<path class="fk-arrow"
		d="M 580,136 C 560,136 550,120 520,114"
		marker-end="url(#arrow)"/>
	<!-- refs.child → objects -->
	<path class="fk-arrow"
		d="M 580,158 C 560,158 550,125 520,114"
		marker-end="url(#arrow)"/>

	<!-- instance_listeners.broadcaster → objects -->
	<path class="fk-arrow"
		d="M 830,136 C 700,136 660,120 520,114"
		marker-end="url(#arrow)"/>
	<!-- instance_listeners.listener → objects -->
	<path class="fk-arrow"
		d="M 830,158 C 700,158 660,125 520,114"
		marker-end="url(#arrow)"/>

	<!-- class_listeners.class → objects -->
	<path class="fk-arrow"
		d="M 830,336 C 680,336 620,200 520,114"
		marker-end="url(#arrow)"/>
	<!-- class_listeners.listener → objects -->
	<path class="fk-arrow"
		d="M 830,358 C 670,358 610,210 520,114"
		marker-end="url(#arrow)"/>

	<!-- =========================================================== -->
	<!-- Views (blue-gray) — derived queries, no FK arrows           -->
	<!-- =========================================================== -->
	<text x="70" y="560" class="cluster-label" fill="#607d8b">views (derived)</text>

	<g transform="translate(70, 580)">
		<rect x="0" y="0" width="180" height="52" rx="6" ry="6"
			fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 168 q 6,0 6,6 V 26 H 0 Z" fill="#607d8b"/>
		<text x="90" y="18" text-anchor="middle" class="table-name">roles</text>
		<text x="10" y="44" class="col">col: object_pk</text>
	</g>

	<g transform="translate(270, 580)">
		<rect x="0" y="0" width="180" height="52" rx="6" ry="6"
			fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 168 q 6,0 6,6 V 26 H 0 Z" fill="#607d8b"/>
		<text x="90" y="18" text-anchor="middle" class="table-name">uspace</text>
		<text x="10" y="44" class="col">col: object_pk</text>
	</g>

	<g transform="translate(470, 580)">
		<rect x="0" y="0" width="240" height="70" rx="6" ry="6"
			fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 228 q 6,0 6,6 V 26 H 0 Z" fill="#607d8b"/>
		<text x="120" y="18" text-anchor="middle" class="table-name">frame_scoped_vars</text>
		<text x="10" y="44" class="col">col: frame_pk, scope_idx,</text>
		<text x="10" y="60" class="col">     var_name, value_pk</text>
	</g>

	<g transform="translate(730, 580)">
		<rect x="0" y="0" width="180" height="52" rx="6" ry="6"
			fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 168 q 6,0 6,6 V 26 H 0 Z" fill="#607d8b"/>
		<text x="90" y="18" text-anchor="middle" class="table-name">object_bucket</text>
		<text x="10" y="44" class="col">col: object_pk, bucket_pk</text>
	</g>

	<g transform="translate(930, 580)">
		<rect x="0" y="0" width="180" height="52" rx="6" ry="6"
			fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
		<path d="M 0,6 Q 0,0 6,0 h 168 q 6,0 6,6 V 26 H 0 Z" fill="#607d8b"/>
		<text x="90" y="18" text-anchor="middle" class="table-name">object_stack</text>
		<text x="10" y="44" class="col">col: object_pk, stack_pk</text>
	</g>

	<!-- =========================================================== -->
	<!-- Legend                                                      -->
	<!-- =========================================================== -->
	<g transform="translate(70, 700)">
		<text x="0" y="0" class="cluster-label" fill="#212121">Legend</text>
		<text x="0" y="24" class="pk">PK</text>
		<text x="60" y="24" class="col">primary key</text>
		<text x="0" y="42" class="fk">FK</text>
		<text x="60" y="42" class="col">foreign key</text>
		<text x="0" y="60" class="col">col</text>
		<text x="60" y="60" class="col">regular column</text>

		<line x1="200" y1="20" x2="270" y2="20" class="fk-arrow" marker-end="url(#arrow)"/>
		<text x="280" y="24" class="col">cross-table FK reference</text>

		<path class="self-fk" d="M 220,42 c 12,-8 12,-14 4,-16 c -8,-2 -12,10 -4,16" marker-end="url(#arrow)"/>
		<text x="280" y="42" class="col">self-referential FK on `objects`</text>

		<text x="0" y="90" class="col">Primitive discriminator (`objects.primitive`):</text>
		<text x="0" y="108" class="col">'o' object · 'h' HashPrimitive · 'a' ArrayPrimitive · 'f' frame · 'r' role</text>
	</g>
</svg>
