<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="1500" role="img"
	aria-label="CVM schema. Five tables: `cvm` marker (gray), `objects` and `refs` in the object-graph cluster (teal), `instance_listeners` and `class_listeners` in the listeners cluster (purple). Frames, processes, and roles are not separate tables — they are `objects` rows discriminated by the `primitive` column ('f' = frame, 'r' = role, 'o'/'h'/'a' for scalars and containers; `process = 1` marks a cap frame). Foreign keys are drawn as curved arrows; self-referential FKs (parent_role, owner_role, parent_frame) as dashed self-loops on the right edge of the `objects` box.">

	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
			markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
		</marker>
		<style>
			.title      { font: 600 20px system-ui, -apple-system, sans-serif; fill: #111 }
			.tbl-name   { font: 600 15px system-ui, -apple-system, sans-serif; fill: #111 }
			.col        { font: 12px ui-monospace, "SF Mono", monospace; fill: #222 }
			.col-pk     { font: 600 12px ui-monospace, "SF Mono", monospace; fill: #222 }
			.col-fk     { font: 600 12px ui-monospace, "SF Mono", monospace; fill: #144a6c }
			.col-note   { font: 11px system-ui, sans-serif; fill: #666 }
			.note       { font: italic 11px system-ui, sans-serif; fill: #555 }
			.legend     { font: 12px system-ui, sans-serif; fill: #333 }
			.legend-h   { font: 600 13px system-ui, sans-serif; fill: #111 }
			.fk-line    { stroke: #555; stroke-width: 1.4; fill: none }
			.fk-self    { stroke: #555; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3 }
		</style>
	</defs>

	<rect width="100%" height="100%" fill="#fff"/>

	<text x="750" y="34" text-anchor="middle" class="title">CVM schema</text>

	<!-- ============================================================ -->
	<!-- cvm marker table (gray)                                       -->
	<!-- ============================================================ -->
	<g id="tbl-cvm">
		<rect x="60" y="80" width="220" height="90" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.5" rx="3"/>
		<rect x="60" y="80" width="220" height="28" fill="#d8d8d8" stroke="#6b6b6b" stroke-width="1.5" rx="3"/>
		<text x="170" y="100" text-anchor="middle" class="tbl-name">cvm</text>
		<text x="72" y="128" class="col-pk">key</text>       <text x="270" y="128" text-anchor="end" class="col-note">text pk</text>
		<text x="72" y="152" class="col">value</text>         <text x="270" y="152" text-anchor="end" class="col-note">text</text>
	</g>
	<text x="170" y="188" text-anchor="middle" class="note">version marker (single row)</text>

	<!-- ============================================================ -->
	<!-- objects table (teal) — the big one                            -->
	<!-- ============================================================ -->
	<g id="tbl-objects">
		<rect x="340" y="80" width="440" height="452" fill="#dcebec" stroke="#4a9999" stroke-width="1.5" rx="3"/>
		<rect x="340" y="80" width="440" height="28" fill="#a8d4d5" stroke="#4a9999" stroke-width="1.5" rx="3"/>
		<text x="560" y="100" text-anchor="middle" class="tbl-name">objects</text>

		<!-- columns: y starts at 128, step 24 -->
		<text x="352" y="128" class="col-pk">object_pk</text>        <text x="770" y="128" text-anchor="end" class="col-note">text pk</text>
		<text x="352" y="152" class="col">primitive</text>            <text x="770" y="152" text-anchor="end" class="col-note">text not null · 'o' 'h' 'a' 'f' 'r'</text>
		<text x="352" y="176" class="col">scalar_type</text>          <text x="770" y="176" text-anchor="end" class="col-note">text · 's' 'n' 'b' 'u' (o only)</text>
		<text x="352" y="200" class="col">scalar_value</text>         <text x="770" y="200" text-anchor="end" class="col-note">blob (typeof matches scalar_type)</text>
		<text x="352" y="224" class="col">core_role</text>            <text x="770" y="224" text-anchor="end" class="col-note">text · 'e' 'c' 'u' (r only, unique)</text>
		<text x="352" y="248" class="col-fk">parent_role</text>       <text x="770" y="248" text-anchor="end" class="col-note">fk → objects · r only · immutable · RESTRICT</text>
		<text x="352" y="272" class="col-fk">owner_role</text>        <text x="770" y="272" text-anchor="end" class="col-note">fk → objects · required on non-roles · immutable</text>
		<text x="352" y="296" class="col">ast</text>                  <text x="770" y="296" text-anchor="end" class="col-note">text json · biconditional with primitive='f'</text>
		<text x="352" y="320" class="col">stmt_idx</text>             <text x="770" y="320" text-anchor="end" class="col-note">int (f only) · advances with gc=1</text>
		<text x="352" y="344" class="col">process</text>              <text x="770" y="344" text-anchor="end" class="col-note">int · 1 marks the cap frame (f only)</text>
		<text x="352" y="368" class="col-fk">parent_frame</text>      <text x="770" y="368" text-anchor="end" class="col-note">fk → objects · nested-frame link (f only)</text>
		<text x="352" y="392" class="col">persistent</text>           <text x="770" y="392" text-anchor="end" class="col-note">int · 1 = pinned · mandatory on core roles</text>
		<text x="352" y="416" class="col">gc</text>                   <text x="770" y="416" text-anchor="end" class="col-note">int · 1 = cleanup phase (f only)</text>
		<text x="352" y="440" class="col">needs_trace</text>          <text x="770" y="440" text-anchor="end" class="col-note">int · GC-drain worklist mark</text>
		<text x="352" y="464" class="col">in_trace</text>             <text x="770" y="464" text-anchor="end" class="col-note">int · GC callback-order index</text>
		<text x="352" y="488" class="col">debug</text>                <text x="770" y="488" text-anchor="end" class="col-note">text · informational label</text>
	</g>
	<text x="560" y="552" text-anchor="middle" class="note">frames, roles, and processes are `objects` rows — discriminated by `primitive`</text>

	<!-- self-FKs on parent_role (y=248), owner_role (y=272), parent_frame (y=368) -->
	<!-- loops on the right edge of the objects box (x=780) -->
	<path class="fk-self" d="M 780 248 C 810 248 810 232 795 232 C 780 232 780 248 780 248" marker-end="url(#arrow)"/>
	<path class="fk-self" d="M 780 272 C 815 272 815 254 800 254 C 785 254 785 272 780 272" marker-end="url(#arrow)"/>
	<path class="fk-self" d="M 780 368 C 810 368 810 352 795 352 C 780 352 780 368 780 368" marker-end="url(#arrow)"/>
	<text x="822" y="240" class="note">parent_role → self</text>
	<text x="822" y="264" class="note">owner_role → self</text>
	<text x="822" y="360" class="note">parent_frame → self</text>

	<!-- ============================================================ -->
	<!-- refs table (teal) — the ref graph                             -->
	<!-- ============================================================ -->
	<g id="tbl-refs">
		<rect x="1080" y="80" width="360" height="180" fill="#dcebec" stroke="#4a9999" stroke-width="1.5" rx="3"/>
		<rect x="1080" y="80" width="360" height="28" fill="#a8d4d5" stroke="#4a9999" stroke-width="1.5" rx="3"/>
		<text x="1260" y="100" text-anchor="middle" class="tbl-name">refs</text>

		<text x="1092" y="128" class="col-pk">ref_pk</text>           <text x="1430" y="128" text-anchor="end" class="col-note">int pk autoincrement</text>
		<text x="1092" y="152" class="col-fk">parent</text>            <text x="1430" y="152" text-anchor="end" class="col-note">fk → objects · ON DELETE CASCADE</text>
		<text x="1092" y="176" class="col-fk">child</text>             <text x="1430" y="176" text-anchor="end" class="col-note">fk → objects · ON DELETE RESTRICT</text>
		<text x="1092" y="200" class="col">key</text>                  <text x="1430" y="200" text-anchor="end" class="col-note">text · required when parent is 'h'</text>
		<text x="1092" y="224" class="col">idx</text>                  <text x="1430" y="224" text-anchor="end" class="col-note">int · required when parent is 'a'</text>
	</g>
	<text x="1260" y="278" text-anchor="middle" class="note">object-graph edges · one-hash-one-array cap on non-container parents</text>

	<!-- ============================================================ -->
	<!-- instance_listeners (purple)                                   -->
	<!-- ============================================================ -->
	<g id="tbl-instance-listeners">
		<rect x="1080" y="320" width="360" height="180" fill="#eedde8" stroke="#a04c88" stroke-width="1.5" rx="3"/>
		<rect x="1080" y="320" width="360" height="28" fill="#dbb0ce" stroke="#a04c88" stroke-width="1.5" rx="3"/>
		<text x="1260" y="340" text-anchor="middle" class="tbl-name">instance_listeners</text>

		<text x="1092" y="368" class="col-pk">reg_pk</text>            <text x="1430" y="368" text-anchor="end" class="col-note">int pk autoincrement</text>
		<text x="1092" y="392" class="col-fk">broadcaster</text>       <text x="1430" y="392" text-anchor="end" class="col-note">fk → objects · CASCADE (weak-ref)</text>
		<text x="1092" y="416" class="col-fk">listener</text>          <text x="1430" y="416" text-anchor="end" class="col-note">fk → objects · CASCADE (weak-ref)</text>
		<text x="1092" y="440" class="col">event_name</text>           <text x="1430" y="440" text-anchor="end" class="col-note">text</text>
		<text x="1092" y="464" class="col">method_name</text>          <text x="1430" y="464" text-anchor="end" class="col-note">text</text>
	</g>
	<text x="1260" y="518" text-anchor="middle" class="note">unique (broadcaster, event_name, listener, method_name)</text>

	<!-- ============================================================ -->
	<!-- class_listeners (purple)                                      -->
	<!-- ============================================================ -->
	<g id="tbl-class-listeners">
		<rect x="1080" y="560" width="360" height="180" fill="#eedde8" stroke="#a04c88" stroke-width="1.5" rx="3"/>
		<rect x="1080" y="560" width="360" height="28" fill="#dbb0ce" stroke="#a04c88" stroke-width="1.5" rx="3"/>
		<text x="1260" y="580" text-anchor="middle" class="tbl-name">class_listeners</text>

		<text x="1092" y="608" class="col-pk">reg_pk</text>            <text x="1430" y="608" text-anchor="end" class="col-note">int pk autoincrement</text>
		<text x="1092" y="632" class="col-fk">class</text>             <text x="1430" y="632" text-anchor="end" class="col-note">fk → objects · CASCADE (weak-ref)</text>
		<text x="1092" y="656" class="col-fk">listener</text>          <text x="1430" y="656" text-anchor="end" class="col-note">fk → objects · CASCADE (weak-ref)</text>
		<text x="1092" y="680" class="col">event_name</text>           <text x="1430" y="680" text-anchor="end" class="col-note">text</text>
		<text x="1092" y="704" class="col">method_name</text>          <text x="1430" y="704" text-anchor="end" class="col-note">text</text>
	</g>
	<text x="1260" y="758" text-anchor="middle" class="note">unique (class, event_name, listener, method_name)</text>

	<!-- ============================================================ -->
	<!-- FK arrows: cross-table                                        -->
	<!-- refs.parent → objects.object_pk    (from refs row y=152 to objects header) -->
	<!-- refs.child → objects.object_pk     (from refs row y=176 to objects, offset) -->
	<!-- instance_listeners.broadcaster → objects (from y=392) -->
	<!-- instance_listeners.listener → objects (from y=416) -->
	<!-- class_listeners.class → objects (from y=632) -->
	<!-- class_listeners.listener → objects (from y=656) -->
	<!-- ============================================================ -->

	<!-- All FK arrows converge on objects.object_pk (right edge, x=780,y=128). -->
	<!-- Grouped by source table; each source's arrows share a curve family     -->
	<!-- to keep the target uncluttered.                                        -->

	<!-- refs.parent → objects.object_pk -->
	<path class="fk-line"
		d="M 1080 152 C 960 152 900 128 780 128"
		marker-end="url(#arrow)"/>
	<!-- refs.child → objects.object_pk -->
	<path class="fk-line"
		d="M 1080 176 C 970 176 900 128 780 128"
		marker-end="url(#arrow)"/>

	<!-- instance_listeners.broadcaster → objects.object_pk -->
	<path class="fk-line"
		d="M 1080 392 C 940 392 900 260 780 128"
		marker-end="url(#arrow)"/>
	<!-- instance_listeners.listener → objects.object_pk -->
	<path class="fk-line"
		d="M 1080 416 C 930 416 900 270 780 128"
		marker-end="url(#arrow)"/>

	<!-- class_listeners.class → objects.object_pk -->
	<path class="fk-line"
		d="M 1080 632 C 900 632 870 350 780 128"
		marker-end="url(#arrow)"/>
	<!-- class_listeners.listener → objects.object_pk -->
	<path class="fk-line"
		d="M 1080 656 C 890 656 860 360 780 128"
		marker-end="url(#arrow)"/>

	<!-- ============================================================ -->
	<!-- Legend / notes                                                -->
	<!-- ============================================================ -->
	<g id="legend" transform="translate(60, 630)">
		<text x="0" y="0" class="legend-h">Views (single-column filters over `objects`)</text>
		<text x="0" y="22" class="legend"><tspan class="col-pk">roles</tspan> — objects where primitive = 'r'</text>
		<text x="0" y="42" class="legend"><tspan class="col-pk">uspace</tspan> — roles ∪ persistent = 1 ∪ process = 1 (GC anchors)</text>
		<text x="0" y="62" class="legend"><tspan class="col-pk">frame_scoped_vars</tspan> — flattened variable lookup across a frame's scopes</text>
		<text x="0" y="82" class="legend"><tspan class="col-pk">object_bucket</tspan>, <tspan class="col-pk">object_stack</tspan> — utility joins over refs</text>

		<text x="0" y="120" class="legend-h">Primitive discriminator (`objects.primitive`)</text>
		<text x="0" y="142" class="legend"><tspan class="col-pk">'o'</tspan> object / scalar   <tspan class="col-pk">'h'</tspan> HashPrimitive   <tspan class="col-pk">'a'</tspan> ArrayPrimitive   <tspan class="col-pk">'f'</tspan> frame   <tspan class="col-pk">'r'</tspan> role</text>
		<text x="0" y="162" class="legend">frames, roles, and processes fold into `objects` — the row-kind carries the discriminator</text>

		<text x="0" y="200" class="legend-h">Line styles</text>
		<line x1="0" y1="220" x2="60" y2="220" class="fk-line" marker-end="url(#arrow)"/>
		<text x="72" y="224" class="legend">solid: cross-table foreign key</text>
		<line x1="360" y1="220" x2="420" y2="220" class="fk-self" marker-end="url(#arrow)"/>
		<text x="432" y="224" class="legend">dashed: self-referential FK on `objects`</text>
	</g>

	<!-- ============================================================ -->
	<!-- Cluster labels                                                -->
	<!-- ============================================================ -->
	<text x="170" y="60" text-anchor="middle" class="note" fill="#6b6b6b">marker</text>
	<text x="560" y="60" text-anchor="middle" class="note" fill="#4a9999">object graph</text>
	<text x="1260" y="60" text-anchor="middle" class="note" fill="#a04c88">listeners</text>
</svg>
