<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="600" role="img" aria-label="Layers: OS, host process, engine, runtime state, user program — with I/O flowing outward through property assignments and capability grants">
	<title>Layers of the Caspian runtime</title>

	<rect x="10" y="10" width="620" height="360" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
	<text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#455a64">OS</text>
	<text x="20" y="46" font-family="sans-serif" font-size="11" fill="#607d8b">files, sockets, streams, processes, environment</text>

	<rect x="30" y="60" width="580" height="300" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
	<text x="40" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#01579b">Host process (Lua, Ruby, Python, ...)</text>
	<text x="40" y="96" font-family="sans-serif" font-size="11" fill="#0277bd">holds OS handles; wires them to engine.* properties</text>

	<rect x="60" y="110" width="520" height="240" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
	<text x="70" y="130" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a148c">Engine (Lua module)</text>
	<text x="70" y="146" font-family="sans-serif" font-size="11" fill="#6a1b9a">reads engine.* properties; builds capability objects; grants them to user</text>

	<rect x="90" y="160" width="460" height="180" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
	<text x="100" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bf360c">Runtime state (built by bootstrap())</text>
	<text x="100" y="196" font-family="sans-serif" font-size="11" fill="#e65100">roles registry, call stack, chain, class table, capability objects</text>

	<rect x="120" y="210" width="400" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
	<text x="130" y="230" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">User program (Caspian source or CaspianJ)</text>
	<text x="130" y="246" font-family="sans-serif" font-size="11" fill="#2e7d32">sees %stdout, %fs, %net, %fetch, etc. — no direct OS access</text>

	<g stroke="#37474f" stroke-width="1.5" fill="none">
		<path d="M 320,280 L 320,50" marker-end="url(#arrow)"/>
	</g>
	<text x="330" y="70" font-family="sans-serif" font-size="10" fill="#37474f">reads propagate up</text>
	<text x="330" y="200" font-family="sans-serif" font-size="10" fill="#37474f">chain of dispatches</text>

	<defs>
		<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
			<path d="M 0,0 L 6,4 L 0,8 Z" fill="#37474f"/>
		</marker>
	</defs>
</svg>
