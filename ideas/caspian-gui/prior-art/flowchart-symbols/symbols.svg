<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" width="500" role="img" aria-label="Standard flowchart symbols: terminator (oval), process (rectangle), decision (rhombus), input/output (parallelogram), data storage (cylinder), predefined process (rectangle with double vertical lines), on-page connector (circle), off-page connector (home-plate pentagon), flow direction (arrow).">
	<title>Standard flowchart symbols</title>

	<defs>
		<marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
		</marker>
	</defs>

	<g fill="none" stroke="currentColor" stroke-width="1.5" font-family="sans-serif">

		<!-- Row 1: terminator, process, decision -->
		<rect x="35" y="30" width="100" height="50" rx="25" ry="25"/>
		<text x="85" y="100" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Terminator (Start / End)</text>

		<rect x="200" y="30" width="100" height="50"/>
		<text x="250" y="100" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Process</text>

		<polygon points="415,25 465,55 415,85 365,55"/>
		<text x="415" y="105" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Decision</text>

		<!-- Row 2: I/O, data storage, predefined process -->
		<polygon points="45,175 145,175 125,225 25,225"/>
		<text x="85" y="245" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Input / Output</text>

		<path d="M 200 180 L 300 180 L 300 225 A 50 8 0 0 1 200 225 Z"/>
		<ellipse cx="250" cy="180" rx="50" ry="8"/>
		<text x="250" y="245" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Data storage</text>

		<rect x="365" y="175" width="100" height="50"/>
		<line x1="373" y1="175" x2="373" y2="225"/>
		<line x1="457" y1="175" x2="457" y2="225"/>
		<text x="415" y="245" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Predefined process</text>

		<!-- Row 3: on-page connector, off-page connector, flow -->
		<circle cx="85" cy="345" r="22"/>
		<text x="85" y="390" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">On-page connector</text>

		<polygon points="210,320 290,320 290,345 250,370 210,345"/>
		<text x="250" y="390" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Off-page connector</text>

		<line x1="365" y1="345" x2="463" y2="345" stroke-width="2" marker-end="url(#fc-arrow)"/>
		<text x="415" y="390" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Flow direction</text>

		<!-- Caption -->
		<text x="250" y="425" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" opacity="0.6" font-style="italic">Nine of the most-used ISO 5807 / ANSI Y15.3 flowchart shapes.</text>

	</g>
</svg>
