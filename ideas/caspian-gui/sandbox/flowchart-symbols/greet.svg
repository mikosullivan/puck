<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" role="img" aria-label="Flowchart of a short Caspian script that reads a name from stdin and greets accordingly. Top to bottom: Start (oval), read $name from stdin (I/O parallelogram), decision rhombus asking if $name is empty, Yes branch printing 'Hello, stranger', No branch printing 'Hello, {name}', both converging to End (oval).">
	<title>Caspian: greet by name</title>

	<defs>
		<marker id="pretty-arrow" viewBox="0 0 10 10" refX="9" refY="5"
			markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#616161"/>
		</marker>

		<filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
			<feOffset dx="0" dy="2" result="offsetblur"/>
			<feComponentTransfer>
				<feFuncA type="linear" slope="0.35"/>
			</feComponentTransfer>
			<feMerge>
				<feMergeNode/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<!-- Page background -->
	<rect x="0" y="0" width="640" height="480" fill="#fafafa"/>

	<g font-family="'Helvetica Neue', Arial, sans-serif" fill="#212121">

		<!-- Start terminator -->
		<g filter="url(#soft-shadow)">
			<rect x="260" y="22" width="120" height="45" rx="22" ry="22"
				fill="#ffcdd2" stroke="#e57373" stroke-width="1.5"/>
			<text x="320" y="50" text-anchor="middle" font-size="14" font-weight="600">Start</text>
		</g>

		<line x1="320" y1="67" x2="320" y2="97" stroke="#616161" stroke-width="1.5" marker-end="url(#pretty-arrow)"/>

		<!-- Read I/O parallelogram -->
		<g filter="url(#soft-shadow)">
			<polygon points="260,100 400,100 380,150 240,150"
				fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
			<text x="320" y="130" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13">$name = %stdin.read_line</text>
		</g>

		<line x1="320" y1="150" x2="320" y2="177" stroke="#616161" stroke-width="1.5" marker-end="url(#pretty-arrow)"/>

		<!-- Decision rhombus -->
		<g filter="url(#soft-shadow)">
			<polygon points="320,180 410,225 320,270 230,225"
				fill="#fff9c4" stroke="#ffb74d" stroke-width="1.5"/>
			<text x="320" y="230" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12">$name.empty?</text>
		</g>

		<!-- Yes branch: from left tip of rhombus, curve down-left to Yes I/O -->
		<path d="M 230 225 Q 170 240 170 315" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#pretty-arrow)"/>
		<text x="185" y="255" font-size="12" font-style="italic" fill="#616161">Yes</text>

		<!-- No branch: from right tip of rhombus, curve down-right to No I/O -->
		<path d="M 410 225 Q 470 240 470 315" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#pretty-arrow)"/>
		<text x="440" y="255" font-size="12" font-style="italic" fill="#616161">No</text>

		<!-- Yes I/O parallelogram -->
		<g filter="url(#soft-shadow)">
			<polygon points="110,318 250,318 230,368 90,368"
				fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
			<text x="170" y="347" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12">puts 'Hello, stranger'</text>
		</g>

		<!-- No I/O parallelogram -->
		<g filter="url(#soft-shadow)">
			<polygon points="410,318 550,318 530,368 390,368"
				fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
			<text x="470" y="347" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12">puts "Hello, {$name}"</text>
		</g>

		<!-- Merge arrows: curved paths converging on End -->
		<path d="M 170 368 Q 170 418 275 418" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#pretty-arrow)"/>
		<path d="M 470 368 Q 470 418 365 418" fill="none" stroke="#616161" stroke-width="1.5" marker-end="url(#pretty-arrow)"/>

		<!-- End terminator -->
		<g filter="url(#soft-shadow)">
			<rect x="260" y="418" width="120" height="45" rx="22" ry="22"
				fill="#ffcdd2" stroke="#e57373" stroke-width="1.5"/>
			<text x="320" y="446" text-anchor="middle" font-size="14" font-weight="600">End</text>
		</g>

	</g>
</svg>
