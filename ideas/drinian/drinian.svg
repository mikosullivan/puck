<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
	<title>Cycle GC via backward trace — moment after $b = null</title>

	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
		</marker>
		<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
		</marker>
	</defs>

	<style><![CDATA[
		text {fill: #222}
		.title {font-size: 20px; font-weight: 600}
		.subtitle {font-size: 13px; fill: #666}
		.section {font-size: 14px; font-weight: 600}
		.label {font-size: 13px}
		.small {font-size: 12px; fill: #57606a}
		.mono {font-family: 'Menlo', 'Consolas', 'Courier New', monospace; font-size: 12px}
		.mono-big {font-family: 'Menlo', 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: 600}
		.obj-box {fill: #f6f7f9; stroke: #6a737d; stroke-width: 1.5}
		.ref-arrow {fill: none; stroke: #57606a; stroke-width: 1.5}
		.trace-arrow {fill: none; stroke: #c62828; stroke-width: 2; stroke-dasharray: 5 4}
		.ghosted {opacity: 0.35}
		.divider {stroke: #d1d5da; stroke-width: 1}
	]]></style>

	<text x="450" y="34" text-anchor="middle" class="title">Cycle GC via backward trace</text>
	<text x="450" y="54" text-anchor="middle" class="subtitle">state at the moment the trigger fires — after $b = null</text>

	<line x1="30" y1="75" x2="870" y2="75" class="divider"/>

	<text x="30" y="102" class="section">Source</text>
	<text x="30" y="126" class="mono">$a = {}</text>
	<text x="30" y="144" class="mono">$b = {}</text>
	<text x="30" y="162" class="mono">$a['b'] = $b</text>
	<text x="30" y="180" class="mono">$b['a'] = $a</text>
	<text x="30" y="198" class="mono">$a = null</text>
	<text x="30" y="216" class="mono" fill="#c62828">$b = null  ← we are here</text>

	<text x="30" y="260" class="section">Sidecar (incoming refs by target)</text>
	<text x="30" y="284" class="mono">sidecar[100] = [201]</text>
	<text x="30" y="302" class="mono">sidecar[101] = [200]</text>
	<text x="30" y="322" class="small">(both variable refs are gone; only</text>
	<text x="30" y="338" class="small">the mutual hash_elements remain)</text>

	<rect x="420" y="180" width="150" height="90" rx="8" class="obj-box"/>
	<text x="495" y="207" text-anchor="middle" class="mono-big">Hash 100</text>
	<text x="495" y="228" text-anchor="middle" class="small">holds hash_element 200</text>
	<text x="495" y="246" text-anchor="middle" class="small">(pointing at 101)</text>
	<text x="495" y="264" text-anchor="middle" class="small">refcount = 1</text>

	<rect x="680" y="180" width="150" height="90" rx="8" class="obj-box"/>
	<text x="755" y="207" text-anchor="middle" class="mono-big">Hash 101</text>
	<text x="755" y="228" text-anchor="middle" class="small">holds hash_element 201</text>
	<text x="755" y="246" text-anchor="middle" class="small">(pointing at 100)</text>
	<text x="755" y="264" text-anchor="middle" class="small">refcount = 1</text>

	<path d="M 570 205 Q 625 165 680 205" class="ref-arrow" marker-end="url(#arrow)"/>
	<text x="625" y="155" text-anchor="middle" class="small">hash_element 200</text>

	<path d="M 680 250 Q 625 290 570 250" class="ref-arrow" marker-end="url(#arrow)"/>
	<text x="625" y="308" text-anchor="middle" class="small">hash_element 201</text>

	<g class="ghosted">
		<text x="495" y="145" text-anchor="middle" class="small">↑ $a var ref (destroyed)</text>
		<text x="755" y="145" text-anchor="middle" class="small">↑ $b var ref (destroyed)</text>
	</g>

	<line x1="30" y1="365" x2="870" y2="365" class="divider"/>

	<text x="30" y="395" class="section" fill="#c62828">Trace (backward from target 101)</text>

	<text x="30" y="424" class="mono">visited = { }</text>
	<text x="30" y="446" class="mono">1. add 101.   sidecar[101] = [200]. try 200's parent.</text>
	<text x="30" y="464" class="mono">2. add 100.   sidecar[100] = [201]. try 201's parent.</text>
	<text x="30" y="482" class="mono">3. 201's parent = 101. already in visited. cycle.</text>
	<text x="30" y="500" class="mono">4. no more incoming edges anywhere. no uspace root.</text>
	<text x="30" y="522" class="mono">visited = {101, 100}</text>

	<path d="M 755 275 C 790 380 795 460 630 460 C 470 460 470 380 495 275" class="trace-arrow" marker-end="url(#arrow-red)"/>
	<text x="640" y="405" text-anchor="middle" fill="#c62828" class="small">backward walk</text>

	<text x="30" y="562" class="section">Result</text>
	<text x="30" y="586" class="mono">collect visited set in one pass → both 100 and 101 GCed.</text>
	<text x="30" y="604" class="small">on_close fires per class rules; cascade would handle any refs into other, still-alive objects.</text>
</svg>
